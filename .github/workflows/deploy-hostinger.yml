name: Deploy to Hostinger

on:
  push:
    branches:
      - main

# Prevent concurrent deployments that could overwrite each other
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Production Assets
        run: npm run build

      - name: 🧹 Clean FTP Server Host
        id: parse_server
        shell: bash
        run: |
          # Strip protocol prefix (ftp://, ftps://) and trailing slashes if present
          RAW="${{ secrets.FTP_SERVER }}"
          CLEAN=$(echo "$RAW" | sed -E 's|^[a-zA-Z]+://||' | tr -d ' /')
          echo "clean_server=$CLEAN" >> $GITHUB_OUTPUT

      - name: 🚀 Sync Files to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.parse_server.outputs.clean_server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: public_html/
          dangerous-clean-slate: false
          log-level: verbose
