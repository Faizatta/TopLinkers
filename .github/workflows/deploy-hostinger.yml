name: Deploy to Hostinger

on:
  push:
    branches:
      - main

# Prevent concurrent deployments that could overwrite each other
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Production Assets
        run: npm run build

      - name: 🔍 Detect Hostinger Target Directory & Clean Server
        id: detect_dir
        shell: bash
        run: |
          python3 -c "
          import ftplib, ssl, os
          
          raw_server = os.environ.get('FTP_SERVER', '')
          server = raw_server.replace('ftp://', '').replace('ftps://', '').replace('http://', '').replace('https://', '').strip(' /')
          user = os.environ.get('FTP_USER', '')
          pwd = os.environ.get('FTP_PASS', '')
          
          ftps = ftplib.FTP_TLS()
          ftps.connect(server, 21, timeout=15)
          ftps.auth()
          ftps.login(user, pwd)
          ftps.prot_p()
          
          files = [f.lower() for f in ftps.nlst()]
          print('FTP Root listing:', files)
          
          # If public_html exists and index.html is NOT in current listing, target is public_html/
          if 'public_html' in files and 'index.html' not in files:
              target_dir = 'public_html/'
          else:
              target_dir = './'
              
          print(f'Using target_dir: {target_dir}')
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'clean_server={server}\n')
              out.write(f'target_dir={target_dir}\n')
              
          ftps.quit()
          "
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}

      - name: 🚀 Sync Files to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.detect_dir.outputs.clean_server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: ${{ steps.detect_dir.outputs.target_dir }}
          dangerous-clean-slate: false
          log-level: verbose
