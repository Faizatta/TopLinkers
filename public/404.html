<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | TopLinkers Islamabad</title>
    <meta name="robots" content="noindex, follow" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #081322;
        color: #F8FAFC;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 540px;
        background: rgba(15, 42, 68, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 48px 32px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        background: rgba(22, 180, 232, 0.15);
        color: #16B4E8;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-radius: 9999px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: clamp(2.5rem, 6vw, 3.75rem);
        font-weight: 900;
        color: #FFFFFF;
        line-height: 1.1;
        margin-bottom: 16px;
      }
      h1 span { color: #E53935; }
      p {
        font-size: 16px;
        color: #94A3B8;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-block;
        background: #16B4E8;
        color: #FFFFFF;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 8px;
        transition: background-color 0.2s, transform 0.2s;
      }
      .btn:hover {
        background: #119ecf;
        transform: translateY(-2px);
      }
      .links {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .links a {
        color: #38BDF8;
        font-size: 13px;
        text-decoration: none;
      }
      .links a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">HTTP 404 &bull; Not Found</div>
      <h1><span>404</span> Not Found</h1>
      <p>The page or resource you are looking for does not exist on TopLinkers. Please check the URL or return to our homepage.</p>
      <a href="/" class="btn">Return to Homepage</a>
      <div class="links">
        <a href="/listings">Verified Listings</a>
        <a href="/services">Construction &amp; Solar</a>
        <a href="/about">About Us</a>
        <a href="/contact">Contact</a>
      </div>
    </div>
  </body>
</html>
